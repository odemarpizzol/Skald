# GitHub Actions workflow: builds the addon zip and uploads it to CurseForge when you push a tag.
# Put this file in ".github/workflows/release.yml" of the Skald repository.
# Before it works you need:
#   1. the CurseForge project page created, and its numeric id added to Skald.toc as
#        ## X-Curse-Project-ID: 123456
#   2. a CurseForge API token stored in the GitHub repository secrets as CF_API_KEY
#      (Settings > Secrets and variables > Actions).
# A tag like v0.26.0-beta publishes a BETA file; a plain v1.0.0 publishes a release.
# (Not run here: check the packager's documentation before the first real tag.)
name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and upload
        uses: BigWigsMods/packager@v2
