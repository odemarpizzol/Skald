# Builds the addon zip and uploads it to CurseForge when a tag is pushed.
#
# One-time setup (already done: the project id 1748824 is in Skald.toc):
#   1. CurseForge: create an API token (https://wow.curseforge.com/account/api-tokens).
#   2. GitHub: Settings > Secrets and variables > Actions > New repository secret
#        Name: CF_API_KEY      Value: the token
#
# To publish a version:
#   git tag v0.34.0-beta
#   git push origin v0.34.0-beta
# A tag with "beta" or "alpha" in it publishes a BETA or ALPHA file; a plain v1.0.0 publishes a release.
# The file's changelog is CHANGELOG.md (see .pkgmeta). Watch the run in the repository's Actions tab.
name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and upload
        uses: BigWigsMods/packager@v2
